name: CI

# Runs on every pull request. A red check means the PR is not ready to merge
# (and merging to main deploys, see deploy.yml).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./invoice-frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: invoice-frontend/.nvmrc
          cache: npm
          cache-dependency-path: invoice-frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test/api

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./invoice-api
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test
